manifest_version: 2
api_version: 1
name: focus
version: "0.1.0"
description: >-
  Focus: Cognitive context engine for Hermes Agent. Intercepts turns before inference,
  extracts true intent and entities, prioritizes repository governance, selectively
  ingests memory, and injects winning skills in a single step with zero KV-cache mutation.
author: Jesús Díaz & NeuralCrew Labs
license: MIT
homepage: https://github.com/Kattegat-crew/hermes_focus_plugin
requires_hermes: ">=0.21.6"
kind: standalone
tags:
  - focus
  - context-engine
  - triage
  - skills
  - memory
  - routing
  - cost-control
provides_tools:
  - focus_status
  - focus_route
provides_hooks:
  - pre_llm_call
  - post_llm_call
provides_middleware: []
requires_env: []
config_schema:
  enabled:
    type: bool
    default: true
  pre_hook_enabled:
    type: bool
    default: true
  router_backend:
    type: str
    default: "graph"
    description: "Router engine: 'graph' (default, 100% free graph-theoretic Personalized PageRank semantic router) or 'host_llm' (uses user active model with graph fallback)"
  max_context_tokens:
    type: int
    default: 0
    description: "Context ceiling in tokens: 0 for unlimited (default, preserves full procedural depth without truncation), or positive integer for strict ceiling"
  selective_memory_enabled:
    type: bool
    default: true
  memory_token_budget:
    type: int
    default: 0
    description: "Memory budget in tokens: 0 for unlimited (default, preserves all matching facts), or positive integer for strict ceiling"
  software_inspection_enabled:
    type: bool
    default: true
  sidecar_db_path:
    type: str
    default: ""
  receipts_path:
    type: str
    default: ""
  timeout_ms:
    type: int
    default: 8000
