manifest_version: 2
api_version: 1
name: focus
version: "0.1.1"
description: >-
  Focus: Cognitive context engine for Hermes Agent. Intercepts turns before inference,
  extracts true intent and entities, prioritizes repository governance, selectively
  ingests memory, and injects winning skills in a single step with zero KV-cache mutation.
author: Jesús Díaz & NeuralCrew Labs
license: MIT
homepage: https://github.com/Kattegat-crew/hermes_focus_plugin
requires_hermes: ">=0.21.6"
kind: standalone
tags:
  - focus
  - context-engine
  - triage
  - skills
  - memory
  - routing
  - cost-control
provides_tools:
  - focus_status
  - focus_route
provides_hooks:
  - pre_llm_call
  - post_llm_call
provides_middleware: []
requires_env: []
config_schema:
  enabled:
    type: bool
    default: true
  pre_hook_enabled:
    type: bool
    default: true
  router_backend:
    type: str
    default: "graph"
    description: "Configured router: 'graph' or 'host_llm'; receipts record the backend that actually routed each turn."
  max_context_tokens:
    type: int
    default: 0
    description: "Plugin context ceiling in estimated tokens: 0 imposes no plugin ceiling; host/provider limits may still truncate, or use a positive integer ceiling."
  selective_memory_enabled:
    type: bool
    default: true
  memory_token_budget:
    type: int
    default: 0
    description: "Memory context budget in estimated tokens: 0 imposes no plugin budget, or use a positive integer ceiling."
  software_inspection_enabled:
    type: bool
    default: true
  sidecar_db_path:
    type: str
    default: ""
  receipts_path:
    type: str
    default: ""
  timeout_ms:
    type: int
    default: 0
    description: "Optional plugin model timeout in milliseconds; 0 leaves timeout control to the host/provider."
